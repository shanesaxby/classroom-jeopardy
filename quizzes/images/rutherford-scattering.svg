<title id="t">Rutherford alpha scattering</title><desc id="d">Most alpha particles pass through gold foil, some deflect and one rebounds.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
