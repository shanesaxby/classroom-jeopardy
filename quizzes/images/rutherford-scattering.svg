<g fill="none" stroke="#d1495b" stroke-width="7" marker-end="url(#a)">
<path d="M70 120 L825 120"/><path d="M70 200 L825 200"/><path d="M70 280 L825 280"/><path d="M70 360 L825 360"/>
<path d="M70 235 Q390 235 530 95"/><path d="M70 320 Q430 320 325 435"/>
</g>
<text x="80" y="80" font-family="Arial" font-size="28" font-weight="700">alpha particles</text><text x="610" y="85" font-family="Arial" font-size="25">small deflection</text><text x="175" y="455" font-family="Arial" font-size="25">rare large-angle deflection</text>
