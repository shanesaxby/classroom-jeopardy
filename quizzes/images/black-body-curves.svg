<path d="M105 415 C185 410 265 360 340 275 C400 210 475 260 680 405" fill="none" stroke="#315b7d" stroke-width="7"/>
<path d="M105 415 C155 405 225 300 280 175 C330 65 400 210 650 410" fill="none" stroke="#d68b00" stroke-width="7"/>
<path d="M105 415 C135 390 175 250 220 105 C255 5 330 260 610 415" fill="none" stroke="#d1495b" stroke-width="7"/>
<text x="690" y="395" font-family="Arial" font-size="27" fill="#315b7d">lower T</text><text x="570" y="315" font-family="Arial" font-size="27" fill="#d68b00">medium T</text><text x="370" y="125" font-family="Arial" font-size="27" fill="#d1495b">higher T</text>
<text x="365" y="475" font-family="Arial" font-size="28" font-weight="700">wavelength</text><text x="25" y="300" transform="rotate(-90 25 300)" font-family="Arial" font-size="28" font-weight="700">spectral intensity</text>
