<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Carbon 14 beta minus decay</title><desc id="d">Carbon 14 becomes nitrogen 14 plus an electron and antineutrino, with a down quark changing to an up quark.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
<rect width="1000" height="520" fill="white"/><text x="95" y="105" font-family="Arial" font-size="43" font-weight="700">¹⁴₆C</text><line x1="205" y1="90" x2="330" y2="90" stroke="#17324d" stroke-width="7" marker-end="url(#a)"/><text x="355" y="105" font-family="Arial" font-size="43" font-weight="700">¹⁴₇N + e⁻ + anti-νₑ</text>
<rect x="75" y="175" width="850" height="285" rx="28" fill="#f5f7fa" stroke="#777" stroke-width="4"/>
<text x="110" y="225" font-family="Arial" font-size="29" font-weight="700">inside one neutron:</text><text x="120" y="330" font-family="Arial" font-size="38" font-weight="700">udd</text><line x1="230" y1="315" x2="385" y2="315" stroke="#17324d" stroke-width="7" marker-end="url(#a)"/><text x="420" y="330" font-family="Arial" font-size="38" font-weight="700">uud</text>
<text x="120" y="390" font-family="Arial" font-size="26">neutron</text><text x="420" y="390" font-family="Arial" font-size="26">proton</text><text x="245" y="290" font-family="Arial" font-size="27" font-weight="700">d → u + W⁻</text>
<path d="M570 315 C650 295 685 260 735 245" fill="none" stroke="#7651a8" stroke-width="7" stroke-dasharray="14 8" marker-end="url(#a)"/><text x="610" y="285" font-family="Arial" font-size="28" font-weight="700">W⁻</text>
<line x1="735" y1="245" x2="865" y2="210" stroke="#d68b00" stroke-width="6" marker-end="url(#a)"/><line x1="735" y1="245" x2="865" y2="300" stroke="#315b7d" stroke-width="6" marker-end="url(#a)"/><text x="875" y="215" font-family="Arial" font-size="29" font-weight="700">e⁻</text><text x="875" y="310" font-family="Arial" font-size="29" font-weight="700">anti-νₑ</text>
</svg>