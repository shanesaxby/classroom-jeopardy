<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Forces at the top of a vertical loop</title>
<desc id="desc">A car at the top of a loop has weight and normal force arrows both pointing downward toward the centre.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17324d"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<circle cx="385" cy="255" r="155" fill="none" stroke="#1677b8" stroke-width="10"/>
<rect x="335" y="65" width="100" height="55" rx="10" fill="#d1495b" stroke="#111" stroke-width="4"/>
<circle cx="355" cy="125" r="13" fill="#222"/><circle cx="415" cy="125" r="13" fill="#222"/>
<circle cx="385" cy="255" r="8" fill="#111"/>
<line x1="360" y1="125" x2="360" y2="235" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
<line x1="410" y1="125" x2="410" y2="235" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
<text x="300" y="205" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">mg</text>
<text x="430" y="205" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">N</text>
<text x="425" y="280" font-family="Arial, sans-serif" font-size="28" fill="#111">centre</text>
</svg>