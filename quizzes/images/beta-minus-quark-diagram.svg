<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" role="img" aria-labelledby="t d">
<title id="t">Beta minus decay at quark level</title><desc id="d">A down quark becomes an up quark and emits a W minus boson, which forms an electron and antineutrino.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
<rect width="950" height="500" fill="white"/><line x1="95" y1="350" x2="390" y2="250" stroke="#d1495b" stroke-width="8" marker-end="url(#a)"/><text x="105" y="390" font-family="Arial" font-size="34" font-weight="700">d</text>
<line x1="390" y1="250" x2="710" y2="120" stroke="#1677b8" stroke-width="8" marker-end="url(#a)"/><text x="680" y="100" font-family="Arial" font-size="34" font-weight="700">u</text>
<path d="M390 250 C470 275 500 330 575 330" fill="none" stroke="#7651a8" stroke-width="8" stroke-dasharray="16 9" marker-end="url(#a)"/><text x="470" y="305" font-family="Arial" font-size="31" font-weight="700">W⁻</text>
<line x1="575" y1="330" x2="815" y2="255" stroke="#d68b00" stroke-width="7" marker-end="url(#a)"/><line x1="575" y1="330" x2="815" y2="410" stroke="#315b7d" stroke-width="7" marker-end="url(#a)"/>
<text x="825" y="260" font-family="Arial" font-size="31" font-weight="700">e⁻</text><text x="825" y="425" font-family="Arial" font-size="31" font-weight="700">anti-νₑ</text><circle cx="390" cy="250" r="13" fill="#111"/><circle cx="575" cy="330" r="13" fill="#111"/>
</svg>