<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
<title id="t">Light-clock explanation of time dilation</title><desc id="d">A stationary light clock has a vertical light path, while a moving clock has a longer diagonal path.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
<rect width="1000" height="500" fill="white"/><text x="165" y="45" font-family="Arial" font-size="30" font-weight="700">Clock at rest</text><text x="650" y="45" font-family="Arial" font-size="30" font-weight="700">Clock moving right</text>
<line x1="130" y1="100" x2="400" y2="100" stroke="#333" stroke-width="12"/><line x1="130" y1="400" x2="400" y2="400" stroke="#333" stroke-width="12"/><path d="M265 390 L265 110" stroke="#d1495b" stroke-width="8" marker-end="url(#a)"/>
<line x1="560" y1="100" x2="820" y2="100" stroke="#333" stroke-width="12"/><line x1="690" y1="400" x2="950" y2="400" stroke="#333" stroke-width="12"/><path d="M700 390 L810 110" stroke="#d1495b" stroke-width="8" marker-end="url(#a)"/>
<line x1="610" y1="455" x2="790" y2="455" stroke="#17324d" stroke-width="7" marker-end="url(#a)"/><text x="805" y="465" font-family="Arial" font-size="29" font-weight="700">v</text>
<text x="155" y="470" font-family="Arial" font-size="25">shorter light path</text><text x="680" y="470" font-family="Arial" font-size="25">longer light path</text>
</svg>