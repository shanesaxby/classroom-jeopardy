<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Prograde burn from a circular orbit</title>
<desc id="desc">A spacecraft at point X on the right side of a circular Earth orbit fires tangentially in its direction of motion.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17324d"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<circle cx="350" cy="230" r="160" fill="none" stroke="#1677b8" stroke-width="7"/>
<circle cx="350" cy="230" r="70" fill="#5aa0d6" stroke="#1f5c8a" stroke-width="5"/>
<path d="M315 205 Q350 165 385 205 Q360 190 350 220 Q340 190 315 205" fill="#7bbf6a"/>
<rect x="500" y="212" width="65" height="36" rx="8" fill="#d1495b" stroke="#111" stroke-width="4"/>
<line x1="565" y1="230" x2="690" y2="230" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
<text x="585" y="200" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">prograde burn</text>
<text x="510" y="195" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111">X</text>
<text x="280" y="330" font-family="Arial, sans-serif" font-size="27" fill="#111">initial circular orbit</text>
</svg>