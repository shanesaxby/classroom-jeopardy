<line x1="310" y1="400" x2="720" y2="95" stroke="#d1495b" stroke-width="8"/><circle cx="310" cy="400" r="10" fill="#d1495b"/>
<line x1="310" y1="400" x2="310" y2="435" stroke="#222" stroke-width="3"/><text x="286" y="470" font-family="Arial" font-size="28" font-weight="700">f₀</text>
<text x="500" y="475" font-family="Arial" font-size="28" font-weight="700">frequency f</text><text x="28" y="305" transform="rotate(-90 28 305)" font-family="Arial" font-size="28" font-weight="700">stopping potential Vₛ</text>
