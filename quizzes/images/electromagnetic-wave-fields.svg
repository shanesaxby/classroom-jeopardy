<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
<title id="t">Electric and magnetic fields in an electromagnetic wave</title><desc id="d">A wave travels right. The electric field oscillates vertically and the magnetic field oscillates perpendicular to it.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
<rect width="900" height="480" fill="white"/><line x1="80" y1="250" x2="825" y2="250" stroke="#777" stroke-width="3"/>
<path d="M90 250 C140 80 190 80 240 250 S340 420 390 250 S490 80 540 250 S640 420 690 250 S790 80 825 210" fill="none" stroke="#d1495b" stroke-width="8"/>
<path d="M90 250 C140 180 190 180 240 250 S340 320 390 250 S490 180 540 250 S640 320 690 250 S790 180 825 230" fill="none" stroke="#1677b8" stroke-width="8" stroke-dasharray="12 8"/>
<line x1="690" y1="70" x2="690" y2="420" stroke="#d1495b" stroke-width="5" marker-end="url(#a)"/><text x="710" y="105" font-family="Arial" font-size="29" font-weight="700">Electric field E</text>
<line x1="520" y1="430" x2="610" y2="340" stroke="#1677b8" stroke-width="5" marker-end="url(#a)"/><text x="350" y="455" font-family="Arial" font-size="29" font-weight="700">Magnetic field B</text>
<line x1="100" y1="45" x2="310" y2="45" stroke="#17324d" stroke-width="7" marker-end="url(#a)"/><text x="330" y="57" font-family="Arial" font-size="29" font-weight="700">direction of travel</text>
</svg>