<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Vectors in anticlockwise circular motion</title>
<desc id="desc">An object at the right side of a circle has arrow P upward and arrow Q left toward the centre.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17324d"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<circle cx="350" cy="235" r="145" fill="none" stroke="#1677b8" stroke-width="7"/>
<circle cx="350" cy="235" r="9" fill="#111"/>
<text x="322" y="278" font-family="Arial, sans-serif" font-size="28" fill="#111">centre</text>
<circle cx="495" cy="235" r="18" fill="#d1495b"/>
<line x1="500" y1="215" x2="500" y2="75" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
<text x="522" y="125" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111">P</text>
<line x1="474" y1="235" x2="375" y2="235" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
<text x="425" y="213" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111">Q</text>
<path d="M210 135 A145 145 0 0 1 285 95" fill="none" stroke="#666" stroke-width="5"/>
<polygon points="289,92 268,91 280,109" fill="#666"/>
<text x="80" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">Anticlockwise motion</text>
</svg>