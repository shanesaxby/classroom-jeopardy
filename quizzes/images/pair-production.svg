<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
<title id="t">Electron positron pair production</title><desc id="d">A gamma ray near a nucleus converts into an electron and positron with oppositely curved tracks.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#17324d"/></marker></defs>
<rect width="900" height="480" fill="white"/><path d="M70 240 L400 240" stroke="#d1495b" stroke-width="8" marker-end="url(#a)"/><text x="155" y="210" font-family="Arial" font-size="30" font-weight="700">gamma photon</text>
<circle cx="455" cy="310" r="45" fill="#f2b134" stroke="#8a6200" stroke-width="5"/><text x="428" y="320" font-family="Arial" font-size="28" font-weight="700">nucleus</text>
<circle cx="410" cy="240" r="13" fill="#111"/><path d="M410 240 Q570 150 740 80" fill="none" stroke="#1677b8" stroke-width="8" marker-end="url(#a)"/><path d="M410 240 Q570 330 740 400" fill="none" stroke="#d68b00" stroke-width="8" marker-end="url(#a)"/>
<text x="755" y="90" font-family="Arial" font-size="34" font-weight="700">e⁻</text><text x="755" y="415" font-family="Arial" font-size="34" font-weight="700">e⁺</text>
</svg>